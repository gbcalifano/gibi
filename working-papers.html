<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Working Papers | Giovanbattista Califano</title>
  <meta name="description" content="Ongoing research projects and working papers by Giovanbattista Califano." />
  <meta name="author" content="Giovanbattista Califano" />
  <link rel="canonical" href="https://califano.xyz/working-papers.html" />
  <link rel="stylesheet" href="style.css" />

  <!-- Open Graph -->
  <meta property="og:title" content="Working Papers | Giovanbattista Califano" />
  <meta property="og:description" content="Explore ongoing research projects, drafts, and working papers in behavioral science and food innovation." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://califano.xyz/working-papers.html" />
  <meta property="og:image" content="https://califano.xyz/img/giovanbattista-califano.webp" />

  <link rel="icon" href="img/favicon.png" type="image/png" />
</head>

<body>
<a class="skip" href="#wpt">Skip to content</a>

<div id="wpt">
  <header class="mast">
    <div class="mast-l">
      <nav class="crumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span>
        <span>Research</span><span class="sep">/</span>
        <span style="color: var(--fg)">Working papers</span>
      </nav>
      <h1>Working papers</h1>
    </div>
    <div class="mast-r" id="mastR"></div>
  </header>

  <!-- AUTH GATE -->
  <section class="auth-wrap" id="authView" aria-label="Access">
    <div class="auth-card">
      <h2>Sign in</h2>
      <div class="row">
        <input id="token" type="password" autocomplete="off" placeholder="github_pat_…" aria-label="GitHub token" />
        <button class="btn primary" id="login">Access</button>
      </div>
      <p class="tiny" id="authStatus" style="color: var(--st-rejected); min-height: 16px; margin-top: 10px"></p>
    </div>
  </section>

  <!-- DASHBOARD -->
  <div id="dash" class="hide">
    <section class="overview" id="ov" aria-label="Overview"></section>

    <div class="toolbar">
      <div class="search">
        <span class="ic" id="searchIc"></span>
        <input id="search" placeholder="Search title, tag, collaborator, venue…" aria-label="Search" />
        <button class="clr hide" id="searchClr" aria-label="Clear">&times;</button>
      </div>

      <div class="seg" role="group" aria-label="View" id="viewSeg"></div>

      <select class="tool-sel" id="sort" aria-label="Sort">
        <option value="updated">Recently updated</option>
        <option value="created">Recently created</option>
        <option value="title">Title A–Z</option>
        <option value="status">By status</option>
      </select>

      <div class="tool-spacer"></div>
      <span class="syncline" id="syncline"><span class="d"></span><span id="syncMsg"></span></span>
      <button class="iconbtn" id="refresh" title="Refresh" aria-label="Refresh"></button>
      <button class="iconbtn" id="export" title="Export JSON" aria-label="Export"></button>
      <button class="btn primary" id="newPaper" title="New paper"></button>
    </div>

    <div class="chips" id="chips"></div>

    <div id="viewMount"></div>

    <footer class="foot">
      <div id="footNote"></div>
      <div class="kbd-help">
        <span><kbd>/</kbd> search</span><span><kbd>N</kbd> new</span>
        <span><kbd>1</kbd>–<kbd>3</kbd> views</span><span><kbd>Esc</kbd> close</span>
      </div>
    </footer>
  </div>

  <!-- DRAWER EDITOR -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Edit paper"></aside>

  <!-- TOASTS -->
  <div class="toast-wrap" id="toastWrap"></div>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     Working Papers Tracker — vanilla, GitHub-backed, no demo
     ============================================================ */

  // ---- GitHub config (matches the original site) ----
  var GH = { owner: "gbcalifano", repo: "private", path: "papers.json" };
  var TOKEN_KEY = "githubToken";
  function ghUrl() { return "https://api.github.com/repos/" + GH.owner + "/" + GH.repo + "/contents/" + GH.path; }
  function ghHeaders() { return { "Authorization": "token " + state.token, "Accept": "application/vnd.github.v3+json" }; }
  function b64encode(str) { return btoa(unescape(encodeURIComponent(str))); }
  function b64decode(str) { try { return decodeURIComponent(escape(atob(str))); } catch (e) { return atob(str); } }

  // ---- status model ----
  var STATUSES = ["Not Submitted", "Submitted", "Under Revision", "Accepted", "Rejected"];
  var STATUS_META = {
    "Not Submitted":  { key: "draft",     label: "Draft",     order: 0 },
    "Submitted":      { key: "submitted", label: "Submitted", order: 1 },
    "Under Revision": { key: "revision",  label: "Revision",  order: 2 },
    "Accepted":       { key: "accepted",  label: "Accepted",  order: 3 },
    "Rejected":       { key: "rejected",  label: "Rejected",  order: 4 }
  };
  var BOARD_COLS = STATUSES.slice();
  function sk(st) { return (STATUS_META[st] || STATUS_META["Not Submitted"]).key; }
  function slabel(st) { return (STATUS_META[st] || STATUS_META["Not Submitted"]).label; }
  function statusRank(st) { return STATUS_META[st] ? STATUS_META[st].order : 99; }

  // ---- utils ----
  var $ = function (id) { return document.getElementById(id); };
  function uid() { return "id_" + Math.random().toString(36).slice(2) + "_" + Date.now().toString(36); }
  function todayISO() { return new Date().toISOString().slice(0, 10); }
  function nowISO() { return new Date().toISOString(); }
  function safeJSON(s) { try { return JSON.parse(s); } catch (e) { return null; } }
  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso); if (isNaN(+d)) return "";
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "2-digit" });
  }
  function fmtDateLong(iso) {
    if (!iso) return "";
    var d = new Date(iso); if (isNaN(+d)) return "";
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }
  function daysBetween(a, b) {
    if (!a || !b) return null;
    var d1 = new Date(a), d2 = new Date(b);
    if (isNaN(+d1) || isNaN(+d2)) return null;
    return Math.round((d2 - d1) / 86400000);
  }
  function relDays(iso) {
    var d = daysBetween(String(iso).slice(0, 10), todayISO());
    if (d === null) return "";
    if (d <= 0) return "today";
    if (d === 1) return "1d ago";
    if (d < 30) return d + "d ago";
    if (d < 365) return Math.round(d / 30) + "mo ago";
    return Math.round(d / 365) + "y ago";
  }
  function median(arr) {
    var a = arr.filter(function (v) { return typeof v === "number" && isFinite(v); }).sort(function (x, y) { return x - y; });
    if (!a.length) return null;
    var m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  // ---- paper accessors ----
  function subs(p) { return Array.isArray(p.submissions) ? p.submissions : []; }
  function lastSubmission(p) { var s = subs(p); return s.length ? s[s.length - 1] : null; }
  function lastStatus(p) { var l = lastSubmission(p); return (l && l.status) || "Not Submitted"; }
  function firstSubmissionDate(p) {
    var s = subs(p).map(function (x) { return x.date; }).filter(Boolean).sort();
    return s[0] || null;
  }
  function lastTouched(p) { return p.updatedAt || p.createdAt || firstSubmissionDate(p) || null; }
  function daysInStage(p) {
    var l = lastSubmission(p);
    if (!l || !l.date) return null;
    return daysBetween(l.date, todayISO());
  }
  function normalize(p) {
    return {
      id: p.id || uid(),
      title: p.title || "",
      abstract: p.abstract || "",
      collaborators: Array.isArray(p.collaborators) ? p.collaborators.filter(Boolean) : [],
      tags: Array.isArray(p.tags) ? p.tags.filter(Boolean) : [],
      links: Array.isArray(p.links) ? p.links.map(function (x) { return typeof x === "string" ? x : (x && x.url) || ""; }).filter(Boolean) : [],
      submissions: subs(p).map(function (s) { return { journal: s.journal || "", status: STATUSES.indexOf(s.status) >= 0 ? s.status : "Submitted", date: s.date || todayISO() }; }),
      createdAt: p.createdAt || null,
      updatedAt: p.updatedAt || null
    };
  }

  // ---- stats ----
  function computeStats(all) {
    var counts = { "All": all.length, "Not Submitted": 0, "Submitted": 0, "Under Revision": 0, "Accepted": 0, "Rejected": 0 };
    var totalSubs = 0, activeDays = [];
    var today = todayISO();
    all.forEach(function (p) {
      var st = lastStatus(p);
      counts[st] = (counts[st] || 0) + 1;
      totalSubs += subs(p).length;
      var fst = firstSubmissionDate(p);
      if (fst && (st === "Submitted" || st === "Under Revision")) {
        var d = daysBetween(fst, today); if (d != null) activeDays.push(d);
      }
    });
    return {
      counts: counts,
      active: (counts["Submitted"] || 0) + (counts["Under Revision"] || 0),
      totalSubmissions: totalSubs,
      medActiveDays: median(activeDays),
      acceptRate: (function () {
        var dec = (counts["Accepted"] || 0) + (counts["Rejected"] || 0);
        return dec ? Math.round((counts["Accepted"] || 0) / dec * 100) : null;
      })()
    };
  }

  // ---- icons ----
  var ICONS = {
    search: '<circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    table: '<rect x="3" y="4" width="18" height="16"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="10" x2="9" y2="20"/>',
    board: '<rect x="3" y="4" width="5" height="16"/><rect x="10" y="4" width="5" height="11"/><rect x="17" y="4" width="4" height="14"/>',
    list: '<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>',
    refresh: '<path d="M20 11a8 8 0 1 0-2 6"/><polyline points="20 4 20 11 13 11"/>',
    download: '<path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><line x1="4" y1="20" x2="20" y2="20"/>',
    close: '<line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>',
    logout: '<path d="M14 4h4v16h-4"/><polyline points="9 8 4 12 9 16"/><line x1="4" y1="12" x2="15" y2="12"/>',
    trash: '<polyline points="4 7 20 7"/><path d="M7 7v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7"/><path d="M10 7V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2"/>'
  };
  function icon(name, size) {
    size = size || 14;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
  }
  function badge(st) {
    return '<span class="badge s-' + sk(st) + '"><span class="tick"></span>' + esc(slabel(st)) + "</span>";
  }
  function dayChip(p) {
    var st = lastStatus(p);
    if (st !== "Submitted" && st !== "Under Revision") return "";
    var d = daysInStage(p);
    if (d == null) return "";
    return '<span class="daychip' + (d > 120 ? " warn" : "") + '">' + d + "d in stage</span>";
  }

  // ---- state ----
  var state = {
    token: sessionStorage.getItem(TOKEN_KEY) || "",
    sha: null,
    papers: [],
    loaded: false,
    view: localStorage.getItem("wp_view") || "board",
    q: "",
    filter: "All",
    sort: "updated",
    editing: null,
    drawerOpen: false,
    sub: { journal: "", status: "Submitted", date: todayISO() },
    dragId: null,
    overCol: null,
    focusAfter: null
  };

  // ---- toast + sync ----
  function toast(msg, kind) {
    var wrap = $("toastWrap");
    var el = document.createElement("div");
    el.className = "toast" + (kind === "err" ? " err" : "");
    el.innerHTML = '<span class="x">' + (kind === "err" ? "\u2715" : "\u2713") + "</span>" + esc(msg);
    wrap.appendChild(el);
    setTimeout(function () { el.remove(); }, 2600);
  }
  function setSync(msg, stt) {
    $("syncline").className = "syncline " + (stt || "");
    $("syncMsg").textContent = msg || "";
  }

  // ---- data layer ----
  async function ghLoad() {
    var res = await fetch(ghUrl(), { headers: ghHeaders() });
    if (res.status === 404) return { papers: [], sha: null, fresh: true };
    if (!res.ok) throw new Error("HTTP " + res.status);
    var data = await res.json();
    var parsed = safeJSON(b64decode(data.content || "")) || [];
    return { papers: (Array.isArray(parsed) ? parsed : []).map(normalize), sha: data.sha };
  }
  async function ghSave(next) {
    var body = { message: "Update papers", content: b64encode(JSON.stringify(next, null, 2)), sha: state.sha || undefined };
    var res = await fetch(ghUrl(), { method: "PUT", headers: Object.assign({}, ghHeaders(), { "Content-Type": "application/json" }), body: JSON.stringify(body) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    var data = await res.json();
    return { sha: (data.content && data.content.sha) || state.sha };
  }

  async function load() {
    if (!state.token) return;
    setSync("Loading\u2026", "busy");
    try {
      var r = await ghLoad();
      state.sha = r.sha;
      state.papers = r.papers;
      state.loaded = true;
      setSync(r.fresh ? "Connected \u2014 no papers.json yet" : "Loaded from GitHub", "ok");
      renderAll();
    } catch (e) {
      state.loaded = false;
      setSync("Could not load \u2014 check token & repo", "err");
      renderAuth(true);
      toast("Connection failed", "err");
    }
  }

  async function persist(next, okMsg) {
    state.papers = next;
    renderAll();
    setSync("Saving\u2026", "busy");
    try {
      var r = await ghSave(next);
      state.sha = r.sha;
      setSync("Synced to GitHub", "ok");
      if (okMsg) toast(okMsg);
    } catch (e) {
      setSync("Sync failed \u2014 check token", "err");
      toast("Sync failed", "err");
    }
  }

  async function refresh() {
    setSync("Refreshing\u2026", "busy");
    try { var r = await ghLoad(); state.sha = r.sha; state.papers = r.papers; setSync("Up to date", "ok"); renderAll(); }
    catch (e) { setSync("Refresh failed", "err"); toast("Refresh failed", "err"); }
  }

  // ---- auth ----
  function showAuth(show) {
    $("authView").classList.toggle("hide", !show);
    $("dash").classList.toggle("hide", show);
  }
  function renderAuth(showError) {
    showAuth(true);
    renderMast();
    if (!showError) $("authStatus").textContent = "";
    var t = $("token"); if (t) t.focus();
  }
  function login() {
    var t = $("token").value.trim();
    if (!t) return;
    state.token = t;
    sessionStorage.setItem(TOKEN_KEY, t);
    $("token").value = "";
    $("authStatus").textContent = "";
    showAuth(false);
    renderMast();
    load();
  }
  function logout() {
    state.token = ""; state.sha = null; state.papers = []; state.loaded = false;
    sessionStorage.removeItem(TOKEN_KEY);
    setSync("");
    renderAuth(false);
    toast("Signed out");
  }

  function renderMast() {
    var r = $("mastR");
    if (state.token) {
      r.innerHTML = '<button class="btn ghost" id="signout">' + icon("logout", 13) + " Sign out</button>";
      $("signout").onclick = logout;
    } else {
      r.innerHTML = "";
    }
  }

  // ---- overview ----
  function renderOverview(stats) {
    var metric = function (k, v, u) {
      return '<div class="ov-metric"><div class="k">' + esc(k) + '</div><div class="v">' + v + (u ? '<span class="u">' + u + "</span>" : "") + "</div></div>";
    };
    var segDefs = [
      { st: "Not Submitted" }, { st: "Submitted" }, { st: "Under Revision" }, { st: "Accepted" }, { st: "Rejected" }
    ];
    var metricsHtml =
      metric("Papers", stats.counts["All"] || 0, "") +
      metric("In review", stats.active, "") +
      metric("Accept rate", stats.acceptRate == null ? "\u2014" : stats.acceptRate, stats.acceptRate == null ? "" : "%") +
      metric("Median days in review", stats.medActiveDays == null ? "\u2014" : Math.round(stats.medActiveDays), "") +
      metric("Submissions logged", stats.totalSubmissions, "");

    var segs = segDefs.map(function (s) {
      var n = stats.counts[s.st] || 0;
      return '<div class="pipe-seg s-' + sk(s.st) + '" data-empty="' + (n === 0 ? 1 : 0) + '" data-st="' + esc(s.st) + '" style="flex:' + n + '" title="' + esc(slabel(s.st)) + ": " + n + '"></div>';
    }).join("");

    var legend = segDefs.map(function (s) {
      var n = stats.counts[s.st] || 0;
      return '<span class="li' + (state.filter === s.st ? " active" : "") + '" data-st="' + esc(s.st) + '"><span class="sw s-' + sk(s.st) + '"></span>' + esc(slabel(s.st)) + ' <span class="n">' + n + "</span></span>";
    }).join("");

    $("ov").innerHTML =
      '<div class="ov-metrics">' + metricsHtml + "</div>" +
      '<div class="ov-pipe">' +
        '<div class="ov-pipe-top"><span class="lbl">Pipeline</span><span class="lbl">' + (stats.counts["All"] || 0) + " papers</span></div>" +
        '<div class="pipe-bar" role="img" aria-label="Pipeline distribution by status">' + segs + "</div>" +
        '<div class="pipe-legend">' + legend + "</div>" +
      "</div>";

    Array.prototype.forEach.call($("ov").querySelectorAll("[data-st]"), function (el) {
      el.addEventListener("click", function () {
        var st = el.getAttribute("data-st");
        setFilter(state.filter === st ? "All" : st);
      });
    });
  }

  // ---- chips ----
  function renderChips(stats) {
    var defs = ["All", "Not Submitted", "Submitted", "Under Revision", "Accepted", "Rejected"];
    $("chips").innerHTML = defs.map(function (f) {
      var n = f === "All" ? (stats.counts["All"] || 0) : (stats.counts[f] || 0);
      return '<button class="chip" data-f="' + esc(f) + '" aria-pressed="' + (state.filter === f) + '">' +
        (f === "All" ? "All" : esc(slabel(f))) + ' <span class="c">' + n + "</span></button>";
    }).join("");
    Array.prototype.forEach.call($("chips").querySelectorAll(".chip"), function (b) {
      b.addEventListener("click", function () { setFilter(b.getAttribute("data-f")); });
    });
  }

  function setFilter(f) { state.filter = f; renderAll(); }

  // ---- derived list ----
  function derived() {
    var list = state.papers.slice();
    if (state.filter !== "All") list = list.filter(function (p) { return lastStatus(p) === state.filter; });
    if (state.q.trim()) {
      var s = state.q.trim().toLowerCase();
      list = list.filter(function (p) {
        return (p.title || "").toLowerCase().indexOf(s) >= 0 ||
          p.tags.some(function (t) { return t.toLowerCase().indexOf(s) >= 0; }) ||
          p.collaborators.some(function (c) { return c.toLowerCase().indexOf(s) >= 0; }) ||
          subs(p).some(function (x) { return (x.journal || "").toLowerCase().indexOf(s) >= 0; });
      });
    }
    list.sort(function (a, b) {
      if (state.sort === "title") return (a.title || "").localeCompare(b.title || "");
      if (state.sort === "created") return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
      if (state.sort === "status") return statusRank(lastStatus(a)) - statusRank(lastStatus(b));
      return new Date(lastTouched(b) || 0) - new Date(lastTouched(a) || 0);
    });
    return list;
  }

  // ---- views ----
  function statusSelectHtml(p) {
    var cur = lastStatus(p);
    var opts = STATUSES.map(function (s) {
      return '<option value="' + esc(s) + '"' + (s === cur ? " selected" : "") + ">" + esc(slabel(s).toUpperCase()) + "</option>";
    }).join("");
    return '<div class="adv" data-stop="1"><select class="adv-sel" data-id="' + esc(p.id) + '" aria-label="Set status">' + opts +
      '</select><button class="open" data-open="' + esc(p.id) + '">Open</button></div>';
  }

  function tableHtml(list) {
    var head = '<thead><tr>' +
      thCell("status", "Status", "118px") +
      thCell("title", "Title & detail", "") +
      thCell("venue", "Last venue", "180px") +
      thCell("updated", "Updated", "108px") +
      '<th style="width:190px"></th></tr></thead>';
    var rows = list.map(function (p) {
      var last = lastSubmission(p), upd = lastTouched(p);
      var meta = "";
      if (p.collaborators.length) meta += '<div class="collabx">with <b>' + esc(p.collaborators.join(", ")) + "</b></div>";
      if (p.tags.length) meta += '<div class="meta">' + p.tags.map(function (t) { return '<span class="tagx">' + esc(t) + "</span>"; }).join("") + "</div>";
      var venue = last
        ? '<div class="j">' + esc(last.journal || "\u2014") + '</div><div class="d">' + esc(fmtDate(last.date)) + "</div>"
        : '<span style="color:var(--fg-faint)">not submitted</span>';
      return '<tr' + (state.drawerOpen && state.editing && state.editing.id === p.id ? ' class="row-open"' : "") + '>' +
        '<td><div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">' + badge(lastStatus(p)) + dayChip(p) + "</div></td>" +
        '<td class="c-title"><span class="ttl" data-open="' + esc(p.id) + '">' + esc(p.title || "(untitled)") + "</span>" + meta + "</td>" +
        '<td class="venue-cell">' + venue + "</td>" +
        '<td><span class="upd-cell">' + (upd ? esc(relDays(upd)) : "\u2014") + "</span></td>" +
        "<td>" + statusSelectHtml(p) + "</td></tr>";
    }).join("");
    return '<table class="tbl">' + head + "<tbody>" + rows + "</tbody></table>";
  }
  function thCell(key, label, w) {
    var sortable = { status: "status", title: "title", venue: "created", updated: "updated" }[key];
    var active = sortable && state.sort === sortable;
    return '<th' + (w ? ' style="width:' + w + '"' : "") + (sortable ? ' data-sort="' + sortable + '"' : "") + (active ? ' aria-sort="descending"' : "") + ">" +
      esc(label) + (sortable ? ' <span class="ar">' + (active ? "\u25BC" : "\u25C7") + "</span>" : "") + "</th>";
  }

  function boardHtml(list) {
    var byCol = {};
    BOARD_COLS.forEach(function (c) { byCol[c] = []; });
    list.forEach(function (p) { byCol[lastStatus(p)].push(p); });
    return '<div class="board">' + BOARD_COLS.map(function (col) {
      var cards = byCol[col].length
        ? byCol[col].map(function (p) {
            var last = lastSubmission(p), d = daysInStage(p);
            var tags = p.tags.length ? '<div class="ctags">' + p.tags.slice(0, 3).map(function (t) { return '<span class="tagx">' + esc(t) + "</span>"; }).join("") + "</div>" : "";
            var collab = p.collaborators.length ? '<div class="ccollab">' + esc(p.collaborators.join(", ")) + "</div>" : "";
            return '<div class="card" draggable="true" data-id="' + esc(p.id) + '" data-open="' + esc(p.id) + '">' +
              '<div class="ct">' + esc(p.title || "(untitled)") + "</div>" + tags + collab +
              '<div class="cv"><span>' + esc(last ? (last.journal || "\u2014") : "no venue") + "</span><span>" +
              (d != null ? d + "d" : (last ? esc(fmtDate(last.date)) : "")) + "</span></div></div>";
          }).join("")
        : '<div class="bcol-empty">drop here</div>';
      return '<div class="bcol" data-col="' + esc(col) + '">' +
        '<div class="bcol-head s-' + sk(col) + '"><span class="ttl"><span class="tick"></span>' + esc(slabel(col)) + '</span><span class="n">' + byCol[col].length + "</span></div>" +
        '<div class="bcol-body">' + cards + "</div></div>";
    }).join("") + "</div>";
  }

  function listHtml(list) {
    return '<div class="list">' + list.map(function (p) {
      var last = lastSubmission(p), d = daysInStage(p), st = lastStatus(p);
      var dchip = (st === "Submitted" || st === "Under Revision") && d != null ? '<span class="daychip">' + d + "d</span>" : "";
      var sub = [];
      if (last && last.journal) sub.push('<span><b style="color:var(--fg);font-weight:700">' + esc(last.journal) + "</b></span>");
      if (p.collaborators.length) sub.push("<span>" + esc(p.collaborators.join(", ")) + "</span>");
      if (p.tags.length) sub.push('<span class="mono">' + esc(p.tags.map(function (t) { return "#" + t; }).join(" ")) + "</span>");
      return '<div class="lrow" data-open="' + esc(p.id) + '">' +
        '<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">' + badge(st) + dchip + "</div>" +
        '<div style="min-width:0"><div class="lt">' + esc(p.title || "(untitled)") + '</div><div class="lsub">' + sub.join("") + "</div></div>" +
        '<div class="lright"><span class="upd-cell">' + (lastTouched(p) ? esc(relDays(lastTouched(p))) : "") + "</span></div></div>";
    }).join("") + "</div>";
  }

  function renderView() {
    var list = derived();
    var mount = $("viewMount");
    if (!list.length) {
      var filtered = state.q || state.filter !== "All";
      mount.innerHTML = '<div class="empty"><div class="big">' + (filtered ? "No papers match" : "No papers yet") + "</div>" +
        '<div class="sub">' + (filtered ? "Try clearing the search or filter." : "Add your first working paper to start tracking.") + "</div>" +
        (filtered ? "" : '<button class="btn primary" id="emptyNew">' + icon("plus", 13) + " New paper</button>") + "</div>";
      var en = $("emptyNew"); if (en) en.onclick = newPaper;
      return;
    }
    if (state.view === "table") mount.innerHTML = tableHtml(list);
    else if (state.view === "board") mount.innerHTML = boardHtml(list);
    else mount.innerHTML = listHtml(list);
    wireView();
  }

  function paperById(id) { return state.papers.filter(function (p) { return p.id === id; })[0]; }

  function wireView() {
    var mount = $("viewMount");
    // open handlers (title / row / card)
    Array.prototype.forEach.call(mount.querySelectorAll("[data-open]"), function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.closest("[data-stop]")) return;
        var p = paperById(el.getAttribute("data-open"));
        if (p) openPaper(p);
      });
    });
    // sortable headers
    Array.prototype.forEach.call(mount.querySelectorAll("th[data-sort]"), function (th) {
      th.addEventListener("click", function () { setSort(th.getAttribute("data-sort")); });
    });
    // status selects
    Array.prototype.forEach.call(mount.querySelectorAll(".adv-sel"), function (sel) {
      sel.addEventListener("click", function (e) { e.stopPropagation(); });
      sel.addEventListener("change", function () {
        var p = paperById(sel.getAttribute("data-id"));
        if (p) advance(p, sel.value);
      });
    });
    Array.prototype.forEach.call(mount.querySelectorAll(".open[data-open]"), function (b) {
      b.addEventListener("click", function (e) { e.stopPropagation(); var p = paperById(b.getAttribute("data-open")); if (p) openPaper(p); });
    });
    // board DnD
    Array.prototype.forEach.call(mount.querySelectorAll(".card"), function (card) {
      card.addEventListener("dragstart", function (e) {
        state.dragId = card.getAttribute("data-id");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", state.dragId); } catch (_) {}
        card.classList.add("dragging");
      });
      card.addEventListener("dragend", function () { card.classList.remove("dragging"); state.dragId = null; clearDropHl(); });
    });
    Array.prototype.forEach.call(mount.querySelectorAll(".bcol"), function (col) {
      col.addEventListener("dragover", function (e) { e.preventDefault(); col.classList.add("drop-on"); });
      col.addEventListener("dragleave", function (e) { if (e.target === col) col.classList.remove("drop-on"); });
      col.addEventListener("drop", function (e) {
        e.preventDefault();
        var id = state.dragId || (e.dataTransfer && e.dataTransfer.getData("text/plain"));
        var p = paperById(id);
        clearDropHl(); state.dragId = null;
        if (!p) return;
        var target = col.getAttribute("data-col");
        if (lastStatus(p) === target) return;
        advance(p, target);
      });
    });
  }
  function clearDropHl() {
    Array.prototype.forEach.call(document.querySelectorAll(".bcol.drop-on"), function (c) { c.classList.remove("drop-on"); });
  }

  function setSort(s) { state.sort = s; $("sort").value = s; renderAll(); }

  // ---- actions ----
  function advance(paper, status) {
    if (status === lastStatus(paper)) { renderAll(); return; }
    if (status === "Not Submitted") { toast("Open the paper to manage its draft", "err"); renderAll(); return; }
    var venue = (lastSubmission(paper) || {}).journal || "";
    var next = Object.assign({}, paper, {
      submissions: subs(paper).concat([{ journal: venue, status: status, date: todayISO() }]),
      updatedAt: nowISO()
    });
    persist(state.papers.map(function (p) { return p.id === paper.id ? next : p; }), "Moved to " + slabel(status));
  }

  function openPaper(paper) {
    var exists = state.papers.some(function (p) { return p.id === paper.id; });
    state.editing = Object.assign(JSON.parse(JSON.stringify(paper)), { __exists: exists });
    state.sub = { journal: lastVenue(state.editing), status: nextStatus(state.editing), date: todayISO() };
    state.drawerOpen = true;
    state.focusAfter = paper.title ? null : "dTitle";
    openDrawer();
    renderView();
  }
  function newPaper() {
    state.editing = { id: uid(), title: "", abstract: "", collaborators: [], tags: [], links: [], submissions: [], createdAt: nowISO(), updatedAt: nowISO(), __exists: false };
    state.sub = { journal: "", status: "Submitted", date: todayISO() };
    state.drawerOpen = true;
    state.focusAfter = "dTitle";
    openDrawer();
  }
  function lastVenue(p) { var l = lastSubmission(p); return (l && l.journal) || ""; }
  function nextStatus(p) {
    var st = lastStatus(p);
    if (st === "Not Submitted") return "Submitted";
    if (st === "Submitted") return "Under Revision";
    if (st === "Under Revision") return "Accepted";
    return "Submitted";
  }
  function nextStatusFor(s) {
    if (s === "Submitted") return "Under Revision";
    if (s === "Under Revision") return "Accepted";
    return "Submitted";
  }

  function savePaper() {
    syncDrawerText();
    var f = state.editing;
    if (!f.title.trim()) { toast("Title required", "err"); var t = $("dTitle"); if (t) t.focus(); return; }
    var clean = normalize(f);
    clean.updatedAt = nowISO();
    var exists = state.papers.some(function (p) { return p.id === clean.id; });
    var next = exists ? state.papers.map(function (p) { return p.id === clean.id ? clean : p; }) : [clean].concat(state.papers);
    closeDrawer();
    persist(next, exists ? "Saved" : "Paper created");
  }
  function deletePaper() {
    var f = state.editing;
    if (!window.confirm("Delete \u201C" + (f.title || "this paper") + "\u201D?")) return;
    closeDrawer();
    persist(state.papers.filter(function (p) { return p.id !== f.id; }), "Deleted");
  }

  function exportJSON() {
    var blob = new Blob([JSON.stringify(state.papers, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = "papers.json"; a.click();
    URL.revokeObjectURL(url); toast("Exported papers.json");
  }

  // ---- drawer ----
  var dirty = false;
  function markDirty() { dirty = true; var s = $("savedState"); if (s) s.textContent = "Unsaved changes"; }

  function syncDrawerText() {
    if (!state.editing) return;
    var t = $("dTitle"); if (t) state.editing.title = t.value;
    var a = $("dAbstract"); if (a) state.editing.abstract = a.value;
    var j = $("subJournal"); if (j) state.sub.journal = j.value;
    var ss = $("subStatus"); if (ss) state.sub.status = ss.value;
    var sd = $("subDate"); if (sd) state.sub.date = sd.value;
  }

  function tokensHtml(fieldId, values, placeholder, mono) {
    var chips = values.map(function (v, i) {
      return '<span class="token' + (mono ? " tagtok" : "") + '">' + esc(v) +
        '<button type="button" aria-label="Remove" data-rm="' + i + '">\u00D7</button></span>';
    }).join("");
    return '<div class="tokens" data-tokens="' + fieldId + '">' + chips +
      '<input id="' + fieldId + '" placeholder="' + (values.length ? "" : esc(placeholder)) + '" /></div>';
  }

  function renderDrawer() {
    var f = state.editing;
    if (!f) { $("drawer").innerHTML = ""; return; }
    var isNew = !f.__exists;
    var cur = lastStatus(f);
    var subRows = (f.submissions || []).length === 0
      ? '<div class="tl-empty">No submissions yet \u2014 add the first venue below.</div>'
      : '<div class="timeline">' + f.submissions.map(function (s, i) {
          return '<div class="tl-item s-' + sk(s.status) + '">' +
            '<div class="tl-row"><span class="tl-j">' + esc(s.journal || "\u2014") + '</span><span class="tl-d">' + esc(fmtDateLong(s.date)) + "</span></div>" +
            '<div class="tl-row"><span class="tl-status">' + esc(slabel(s.status)) + '</span><button class="rm" data-rmsub="' + i + '">remove</button></div></div>';
        }).join("") + "</div>";

    var statusOpts = STATUSES.filter(function (s) { return s !== "Not Submitted"; }).map(function (s) {
      return '<option value="' + esc(s) + '"' + (s === state.sub.status ? " selected" : "") + ">" + esc(slabel(s)) + "</option>";
    }).join("");

    $("drawer").innerHTML =
      '<div class="drawer-head"><div style="flex:1;min-width:0">' +
        '<div class="eyebrow"><span>' + (isNew ? "New paper" : "Edit paper") + "</span>" + badge(cur) + "</div>" +
        '<input id="dTitle" class="title-input" placeholder="Untitled paper\u2026" value="' + esc(f.title) + '" /></div>' +
        '<button class="iconbtn" id="drawerClose" aria-label="Close">' + icon("close") + "</button></div>" +
      '<div class="drawer-body">' +
        '<div class="field"><label>Tags</label>' + tokensHtml("dTags", f.tags, "Add a tag, press Enter", true) + "</div>" +
        '<div class="field"><label>Collaborators</label>' + tokensHtml("dCollab", f.collaborators, "Add a name, press Enter", false) + "</div>" +
        '<div class="field"><label>Abstract / notes</label><textarea id="dAbstract" placeholder="Short abstract or internal notes\u2026">' + esc(f.abstract) + "</textarea></div>" +
        '<div class="field"><label>Links <span class="hint">comma-separated URLs</span></label>' + tokensHtml("dLinks", f.links, "https://\u2026", true) + "</div>" +
        '<div class="sec"><h3><span>Submission timeline</span><span style="font-family:var(--mono);color:var(--fg-soft);font-weight:400">' + (f.submissions || []).length + " entries</span></h3>" +
          subRows +
          '<div class="addsub">' +
            '<div class="full"><label>Journal / venue</label><input type="text" id="subJournal" placeholder="Journal name" value="' + esc(state.sub.journal) + '" /></div>' +
            '<div><label>Status</label><select id="subStatus">' + statusOpts + "</select></div>" +
            '<div><label>Date</label><input type="date" id="subDate" value="' + esc(state.sub.date) + '" /></div>' +
            '<div class="full"><button class="btn sm" id="addSub" style="width:100%">' + icon("plus", 12) + " Add to timeline</button></div>" +
          "</div></div>" +
      "</div>" +
      '<div class="drawer-foot"><div>' +
        (isNew ? "" : '<button class="btn ghost sm" id="delPaper">' + icon("trash", 12) + " Delete</button>") + "</div>" +
        '<div style="display:flex;align-items:center;gap:12px"><span class="saved" id="savedState">' + (dirty ? "Unsaved changes" : "Up to date") + "</span>" +
        '<button class="btn primary" id="savePaper">' + (isNew ? "Create paper" : "Save") + "</button></div></div>";

    wireDrawer();
    if (state.focusAfter) { var fe = $(state.focusAfter); if (fe) { fe.focus(); moveCursorEnd(fe); } state.focusAfter = null; }
  }

  function moveCursorEnd(el) { try { var v = el.value; el.value = ""; el.value = v; } catch (_) {} }

  function wireDrawer() {
    $("drawerClose").onclick = closeDrawer;
    $("savePaper").onclick = savePaper;
    var dp = $("delPaper"); if (dp) dp.onclick = deletePaper;
    var as = $("addSub"); if (as) as.onclick = addSubmission;

    $("dTitle").addEventListener("input", function () { state.editing.title = this.value; markDirty(); });
    $("dAbstract").addEventListener("input", function () { state.editing.abstract = this.value; markDirty(); });

    wireTokens("dTags", "tags");
    wireTokens("dCollab", "collaborators");
    wireTokens("dLinks", "links");

    var sj = $("subJournal");
    sj.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addSubmission(); } });
    sj.addEventListener("input", function () { state.sub.journal = this.value; });
    $("subStatus").addEventListener("change", function () { state.sub.status = this.value; });
    $("subDate").addEventListener("change", function () { state.sub.date = this.value; });

    // remove submission
    Array.prototype.forEach.call($("drawer").querySelectorAll("[data-rmsub]"), function (b) {
      b.addEventListener("click", function () {
        var i = parseInt(b.getAttribute("data-rmsub"), 10);
        syncDrawerText();
        state.editing.submissions = state.editing.submissions.filter(function (_, k) { return k !== i; });
        markDirty(); renderDrawer();
      });
    });
  }

  function wireTokens(fieldId, key) {
    var input = $(fieldId);
    var box = $("drawer").querySelector('[data-tokens="' + fieldId + '"]');
    box.addEventListener("click", function (e) {
      var rm = e.target.closest("[data-rm]");
      if (rm) {
        var i = parseInt(rm.getAttribute("data-rm"), 10);
        syncDrawerText();
        state.editing[key] = state.editing[key].filter(function (_, k) { return k !== i; });
        markDirty(); state.focusAfter = fieldId; renderDrawer();
        return;
      }
      input.focus();
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === ",") { e.preventDefault(); commitToken(fieldId, key, input.value); }
      else if (e.key === "Backspace" && !input.value && state.editing[key].length) {
        syncDrawerText();
        state.editing[key] = state.editing[key].slice(0, -1);
        markDirty(); state.focusAfter = fieldId; renderDrawer();
      }
    });
    input.addEventListener("blur", function () { if (input.value.trim()) commitToken(fieldId, key, input.value); });
  }
  function commitToken(fieldId, key, raw) {
    var parts = raw.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    if (!parts.length) return;
    syncDrawerText();
    var arr = state.editing[key].slice();
    parts.forEach(function (p) { if (arr.indexOf(p) < 0) arr.push(p); });
    state.editing[key] = arr;
    markDirty(); state.focusAfter = fieldId; renderDrawer();
  }

  function addSubmission() {
    syncDrawerText();
    if (!state.sub.journal.trim()) return;
    var next = (state.editing.submissions || []).concat([{ journal: state.sub.journal.trim(), status: state.sub.status, date: state.sub.date || todayISO() }]);
    next.sort(function (a, b) { return (a.date || "").localeCompare(b.date || ""); });
    state.editing.submissions = next;
    state.sub = { journal: state.sub.journal.trim(), status: nextStatusFor(state.sub.status), date: todayISO() };
    markDirty(); state.focusAfter = "subJournal"; renderDrawer();
  }

  function openDrawer() {
    dirty = false;
    renderDrawer();
    $("scrim").classList.add("open");
    $("drawer").classList.add("open");
  }
  function closeDrawer() {
    state.drawerOpen = false; state.editing = null;
    $("scrim").classList.remove("open");
    $("drawer").classList.remove("open");
    renderView();
  }

  // ---- render all ----
  function renderAll() {
    if (!state.token) { renderAuth(false); return; }
    showAuth(false);
    renderMast();
    var stats = computeStats(state.papers);
    renderOverview(stats);
    renderChips(stats);
    renderView();
    updateToolbar();
  }
  function updateToolbar() {
    Array.prototype.forEach.call($("viewSeg").querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-v") === state.view);
    });
    $("sort").value = state.sort;
    $("search").value = state.q;
    $("searchClr").classList.toggle("hide", !state.q);
  }

  // ---- static wiring ----
  function init() {
    $("searchIc").innerHTML = icon("search");
    $("refresh").innerHTML = icon("refresh", 18);
    $("export").innerHTML = icon("download", 18);
    $("newPaper").innerHTML = icon("plus", 13) + ' New <span class="kx">N</span>';

    var views = [
      { v: "table", icon: "table", label: "Table" },
      { v: "board", icon: "board", label: "Board" },
      { v: "list", icon: "list", label: "List" }
    ];
    $("viewSeg").innerHTML = views.map(function (b) {
      return '<button data-v="' + b.v + '" aria-pressed="' + (state.view === b.v) + '" title="' + b.label + ' view">' +
        icon(b.icon) + '<span class="tool-lbl">' + b.label + "</span></button>";
    }).join("");
    Array.prototype.forEach.call($("viewSeg").querySelectorAll("button"), function (b) {
      b.addEventListener("click", function () {
        state.view = b.getAttribute("data-v");
        localStorage.setItem("wp_view", state.view);
        renderAll();
      });
    });

    $("login").onclick = login;
    $("token").addEventListener("keydown", function (e) { if (e.key === "Enter") login(); });

    $("search").addEventListener("input", function () { state.q = this.value; $("searchClr").classList.toggle("hide", !this.value); renderView(); });
    $("searchClr").onclick = function () { state.q = ""; $("search").value = ""; this.classList.add("hide"); renderView(); $("search").focus(); };
    $("sort").addEventListener("change", function () { state.sort = this.value; renderView(); });
    $("refresh").onclick = refresh;
    $("export").onclick = exportJSON;
    $("newPaper").onclick = newPaper;
    $("scrim").onclick = closeDrawer;

    document.addEventListener("keydown", function (e) {
      var tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
      var typing = ["input", "textarea", "select"].indexOf(tag) >= 0;
      if (e.key === "Escape") { if (state.drawerOpen) closeDrawer(); return; }
      if (typing || !state.token) return;
      if (e.key === "/") { e.preventDefault(); $("search").focus(); }
      else if (e.key === "n" || e.key === "N") { e.preventDefault(); newPaper(); }
      else if (e.key === "1") { state.view = "table"; localStorage.setItem("wp_view", "table"); renderAll(); }
      else if (e.key === "2") { state.view = "board"; localStorage.setItem("wp_view", "board"); renderAll(); }
      else if (e.key === "3") { state.view = "list"; localStorage.setItem("wp_view", "list"); renderAll(); }
    });

    renderMast();
    if (state.token) load();
    else renderAuth(false);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>

</body>
</html>
